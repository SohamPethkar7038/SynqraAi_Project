<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 43" width="175" height="49">
  <defs>
    <!-- Updated Gradient for the AI node network & icon to the new red shade -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D55" />  <!-- Main Red -->
      <stop offset="100%" stop-color="#FF7F96" /> <!-- Lighter Red/Pink tint -->
    </linearGradient>
    
    <!-- Soft glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background styling (transparent canvas container) -->
  <rect width="168" height="43" fill="transparent" />

  <!-- ICON SECTION (Left side, centered vertically) -->
  <g transform="translate(4, 3.5)">
    <!-- Connection lines (using new gradient) -->
    <path d="M14 6 L24 18 L14 30 L4 18 Z" fill="none" stroke="url(#aiGrad)" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 2" />
    <line x1="14" y1="6" x2="14" y2="30" stroke="url(#aiGrad)" stroke-width="1.2" stroke-opacity="0.7" />
    <line x1="4" y1="18" x2="24" y2="18" stroke="url(#aiGrad)" stroke-width="1.2" stroke-opacity="0.7" />

    <!-- Outer Nodes (using new red shades) -->
    <circle cx="14" cy="5" r="3" fill="#FF7F96" filter="url(#glow)" />
    <circle cx="25" cy="18" r="2.5" fill="#FF2D55" filter="url(#glow)" />
    <circle cx="14" cy="31" r="3" fill="#FF7F96" filter="url(#glow)" />
    <circle cx="3" cy="18" r="2.5" fill="#FF2D55" filter="url(#glow)" />

    <!-- Central Intelligent Core (using new gradient) -->
    <circle cx="14" cy="18" r="5.5" fill="url(#aiGrad)" filter="url(#glow)" />
    <circle cx="14" cy="18" r="2" fill="#FFFFFF" />
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <!-- "Synqra" (Remains Dark Slate for contrast, or could be changed) -->
  <text x="39" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="18" fill="#1E293B" letter-spacing="-0.3">Synqra</text>
  
  <!-- "Ai" (Updated to match the new red gradient) -->
  <text x="100" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="18" fill="url(#aiGrad)" letter-spacing="-0.2">Ai</text>

  <!-- Micro decorative tech dot (Updated to match the new red highlight) -->
  <circle cx="122" cy="13" r="2" fill="#FF2D55" />
</svg>
